[alembic]
# Путь к скриптам миграций Alembic
script_location = alembic

# Разделитель в пути версии (оставляем по умолчанию)
version_path_separator = os

# Строка подключения к базе данных, использующая переменные окружения
# Эти переменные должны быть заданы в момент запуска (например, через .env или Docker)
sqlalchemy.url = postgresql://%(POSTGRES_USER)s:%(POSTGRES_PASSWORD)s@%(POSTGRES_HOST)s:%(POSTGRES_PORT)s/%(POSTGRES_DB)s


# ---- Логирование Alembic и SQLAlchemy ----

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
